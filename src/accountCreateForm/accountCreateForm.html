<template>
    <lightning-card variant="base">
        <!-- Spinner  -->
        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading"></lightning-spinner>
        </template>

        <lightning-input label="Account Name" name="name"></lightning-input>
        <lightning-input label="Account Number" name="accountNumber"></lightning-input>
        <lightning-input label="Phone" name="phone"></lightning-input>


        <template if:true={isContactModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={handleCloseModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close"
                                size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 class="slds-text-heading_medium">Create New Contact</h2>
                    </header>

                    <!-- Account Create Form -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <c-contact-create-form account-id={accountId} ></c-contact-create-form>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Save" onclick={handleSave} variant="brand"></lightning-button>
                        <lightning-button label="Cancel" onclick={handleCloseModal}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
