<!--
*
* Description - This will display Account Records with Imperative Apex call
*
-->
<template>
    <lightning-card title="Account Data Imperative" icon-name="standard:account">

        <div class="slds-m-around_medium">

            <!-- Displaying Account Records -->
            <template lwc:if={data}>
                <lightning-datatable key-field="Id" data={data} columns={columns}>
                </lightning-datatable>
            </template>

            <!-- Displaying Error if Occurs -->
            <template lwc:elseif={error}>
                <c-error-panel errors={error}></c-error-panel>
            </template>
        </div>
    </lightning-card>
</template>
